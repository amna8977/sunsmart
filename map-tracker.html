<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SunSmart Map UV tracker</title>
  <link rel="icon" type="image/png" href="SUN SMART.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="common.css">
  <link rel="stylesheet" href="map-tracker.css">
  <link rel="stylesheet" href="navigation.css">
</head>
<body>
  <div id="loadingScreen" class="loading-screen" aria-label="Loading SunSmart" aria-live="polite">
    <div class="loading-card">
      <img id="loadingLogo" class="loading-logo" src="SUN SMART.png" alt="SunSmart logo">
      <div>Loading SunSmart</div>
    </div>
  </div>

  <nav class="navbar map-navbar">
    <a class="nav-brand" href="index.html">
      <img id="navLogo" class="nav-logo" src="SUN SMART.png" alt="SunSmart logo">
      <span>SunSmart</span>
    </a>
    <div class="nav-links" aria-label="Main navigation">
      <a href="index.html">Home</a>
      <div class="nav-dropdown">
        <button class="nav-trigger" type="button" aria-expanded="false" onclick="toggleNavMenu(event)">UV tracker</button>
        <div class="nav-menu">
          <a href="tracker-basic.html">Basic tracker</a>
          <a href="tracker.html">Advanced tracker</a>
          <a class="active" href="map-tracker.html">Map tracker</a>
        </div>
      </div>
    </div>
  </nav>

  <main class="map-shell" aria-label="Map UV tracker">
    <div id="uvMap"></div>
    <section class="uv-panel" aria-live="polite">
      <p class="panel-kicker">Map UV tracker</p>
      <form id="searchForm" class="search-form">
        <label class="sr-only" for="placeSearch">Search for a place</label>
        <input id="placeSearch" class="search-input" type="search" placeholder="Search city or place" autocomplete="off">
        <button class="action-button search-button" type="submit">Search</button>
      </form>
      <div id="searchPicker" class="search-picker">
        <label for="searchSelect">Select your place:</label>
        <select id="searchSelect" class="search-select"></select>
      </div>
      <h1 id="placeName" class="place-name">Loading map...</h1>
      <div class="uv-row">
        <div id="uvValue" class="uv-value">--</div>
        <div id="riskLevel" class="risk-pill">UV index</div>
      </div>
      <p id="guidance" class="guidance">Move the map, zoom in, or tap a location to check the UV index there.</p>
      <p id="coords" class="coords">Coordinates unavailable</p>
      <div class="city-time-box">
        <span>City local time</span>
        <time id="cityTime">--</time>
      </div>
      <div class="panel-actions">
        <button id="centerButton" class="action-button" type="button">Use my location</button>
        <button id="refreshButton" class="action-button" type="button">Refresh UV</button>
      </div>
    </section>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script>
    const placeName = document.getElementById("placeName");
    const uvValue = document.getElementById("uvValue");
    const riskLevel = document.getElementById("riskLevel");
    const guidance = document.getElementById("guidance");
    const coords = document.getElementById("coords");
    const searchForm = document.getElementById("searchForm");
    const placeSearch = document.getElementById("placeSearch");
    const searchPicker = document.getElementById("searchPicker");
    const searchSelect = document.getElementById("searchSelect");
    const centerButton = document.getElementById("centerButton");
    const refreshButton = document.getElementById("refreshButton");
    let searchCandidates = [];
    let marker;
    let requestToken = 0;
    const cityTime = document.getElementById("cityTime");
    let cityTimeZone = null;

    function updateCityTime() {
      if (!cityTimeZone) return;
      const now = new Date();
      cityTime.textContent = new Intl.DateTimeFormat("en-US", {
        timeZone: cityTimeZone,
        hour: "numeric",
        minute: "2-digit",
        hour12: true
      }).format(now);

      cityTime.dateTime = now.toISOString();
    }

    setInterval(updateCityTime, 1000);

    function hideLoadingScreen() {
      const loadingScreen = document.getElementById("loadingScreen");
      if (!loadingScreen) return;
      loadingScreen.classList.add("hidden");
    }

    function classifyUv(value) {
      if (value < 3) {
        return {
          label: "Low",
          className: "risk-low",
          advice: "Lower risk today, but sunscreen and sunglasses are still smart if you stay outside."
        };
      }

      if (value < 6) {
        return {
          label: "Moderate",
          className: "risk-moderate",
          advice: "Use SPF 30+, sunglasses, and cover up during longer outdoor time."
        };
      }

      if (value < 8) {
        return {
          label: "High",
          className: "risk-high",
          advice: "Use SPF 30+, wear a hat, and look for shade around midday."
        };
      }

      if (value < 11) {
        return {
          label: "Very high",
          className: "risk-very-high",
          advice: "Strong protection is needed: SPF 30+, shade, hat, and sunglasses."
        };
      }

      return {
        label: "Extreme",
        className: "risk-extreme",
        advice: "Avoid midday sun when possible and use full sun protection if outside."
      };
    }

    function formatPlace(data, lat, lon) {
      const address = data && data.address ? data.address : {};
      const primary = address.city || address.town || address.village || address.hamlet || address.suburb || address.county;
      const secondary = address.state || address.region || address.country;

      if (primary && secondary && primary !== secondary) {
        return primary + ", " + secondary;
      }

      if (primary || secondary) {
        return primary || secondary;
      }

      if (data && data.display_name) {
        return data.display_name.split(",").slice(0, 2).join(",");
      }

      return lat.toFixed(3) + ", " + lon.toFixed(3);
    }

    function setPending(lat, lon) {
      placeName.textContent = "Checking this spot...";
      uvValue.textContent = "--";
      riskLevel.className = "risk-pill";
      riskLevel.textContent = "Loading";
      guidance.textContent = "Getting the place name and live UV index for the map center.";
      coords.textContent = lat.toFixed(4) + ", " + lon.toFixed(4);
    }

    function normalizeLongitude(lon) {
      return ((((lon + 180) % 360) + 360) % 360) - 180;
    }

    async function getPlaceName(lat, lon, zoom) {
      const url = new URL("https://nominatim.openstreetmap.org/reverse");
      url.searchParams.set("format", "jsonv2");
      url.searchParams.set("lat", lat);
      url.searchParams.set("lon", lon);
      url.searchParams.set("zoom", Math.max(3, Math.min(18, zoom)));
      url.searchParams.set("addressdetails", "1");

      const response = await fetch(url.toString(), {
        headers: {
          "Accept": "application/json"
        }
      });

      if (!response.ok) {
        throw new Error("Place lookup failed");
      }

      return response.json();
    }

    async function searchPlaces(query) {
      const url = new URL("https://nominatim.openstreetmap.org/search");
      url.searchParams.set("format", "jsonv2");
      url.searchParams.set("q", query);
      url.searchParams.set("limit", "8");
      url.searchParams.set("addressdetails", "1");

      const response = await fetch(url.toString(), {
        headers: {
          "Accept": "application/json"
        }
      });

      if (!response.ok) {
        throw new Error("Search failed");
      }

      const results = await response.json();

      if (!results.length) {
        throw new Error("No search results");
      }

      return results;
    }

    function searchResultLabel(result) {
      const address = result.address || {};
      const primary = result.name || address.city || address.town || address.village || address.hamlet || address.suburb;
      const regionParts = [];

      if (address.state) {
        regionParts.push(address.state);
      }

      if (address.country) {
        regionParts.push(address.country);
      }

      if (primary) {
        return primary + (regionParts.length ? ", " + regionParts.join(", ") : "");
      }

      return result.display_name || "Unknown place";
    }

    function buildSearchSelect() {
      searchSelect.innerHTML = "";

      searchCandidates.forEach(function(candidate, index) {
        const option = document.createElement("option");
        option.value = index;
        option.textContent = searchResultLabel(candidate);
        searchSelect.appendChild(option);
      });
    }

    function selectSearchCandidate(index) {
      const result = searchCandidates[index];

      if (!result) {
        return;
      }

      const lat = Number(result.lat);
      const lon = Number(result.lon);
      const targetZoom = Math.max(map.getZoom(), 10);

      map.setView([lat, lon], targetZoom);
      updateLocation(lat, lon);
    }

    function nearestHourlyUv(data) {
      if (!data.hourly || !data.hourly.time || !data.hourly.uv_index) {
        return null;
      }

      const now = Date.now();
      let bestIndex = -1;
      let bestDistance = Infinity;

      data.hourly.time.forEach(function(time, index) {
        if (!Number.isFinite(data.hourly.uv_index[index])) return;
        const timestamp = typeof time === "number" ? time * 1000 : new Date(time).getTime();
        const distance = Math.abs(timestamp - now);
        if (distance < bestDistance) {
          bestDistance = distance;
          bestIndex = index;
        }
      });

      return bestIndex < 0 ? null : data.hourly.uv_index[bestIndex];
    }

    async function getUvIndex(lat, lon) {
      const url = new URL("https://api.open-meteo.com/v1/forecast");
      url.searchParams.set("latitude", lat);
      url.searchParams.set("longitude", lon);
      url.searchParams.set("current", "is_day");
      url.searchParams.set("hourly", "uv_index");
      url.searchParams.set("forecast_days", "1");
      url.searchParams.set("timezone", "auto");
      url.searchParams.set("timeformat", "unixtime");

      const response = await fetch(url.toString());

      if (!response.ok) {
        throw new Error(response.status === 429 ? "Too many requests. Wait a moment, then refresh UV." : "UV service returned an error (" + response.status + "). Try refreshing UV.");
      }

      const data = await response.json();
      return {
        uv: nearestHourlyUv(data),
        isDay: data.current && data.current.is_day,
        timeZone: data.timezone
      };
    }

    async function updateLocation(lat, lon) {
      const token = ++requestToken;
      const normalizedLon = normalizeLongitude(lon);
      const zoom = map.getZoom();
      cityTimeZone = null;
      cityTime.textContent = "Loading...";
      cityTime.removeAttribute("datetime");
      setPending(lat, normalizedLon);
      marker.setLatLng([lat, normalizedLon]);
      marker.setIcon(locationPinIcon());

      try {
        const [placeResult, { uv, isDay, timeZone }] = await Promise.all([
          getPlaceName(lat, normalizedLon, zoom).catch(() => null),
          getUvIndex(lat, normalizedLon)
        ]);

        if (token !== requestToken) {
          return;
        }

        cityTimeZone = timeZone || null;
        cityTime.textContent = "Unavailable";
        updateCityTime();

        if (!Number.isFinite(uv)) {
          throw new Error("UV data unavailable");
        }

        const risk = classifyUv(uv);
        placeName.textContent = formatPlace(placeResult, lat, lon);
        uvValue.textContent = uv.toFixed(1);
        riskLevel.className = "risk-pill " + risk.className;
        riskLevel.textContent = risk.label;
        guidance.textContent = risk.advice;
        coords.textContent = lat.toFixed(4) + ", " + normalizedLon.toFixed(4);

        if (isDay === 0 || isDay === 1) {
          marker.setIcon(locationPinIcon(isDay === 1));
        }
      } catch (error) {
        if (token !== requestToken) {
          return;
        }

        placeName.textContent = "Could not check this spot";
        if (!cityTimeZone) cityTime.textContent = "Unavailable";
        uvValue.textContent = "--";
        riskLevel.className = "risk-pill";
        riskLevel.textContent = "Unavailable";
        guidance.textContent = error instanceof TypeError
          ? "Could not connect to the UV service. Check your connection and refresh UV."
          : error.message;
        coords.textContent = lat.toFixed(4) + ", " + normalizedLon.toFixed(4);
      }
    }

    function updateFromCenter() {
      const center = map.getCenter();
      updateLocation(center.lat, center.lng);
    }

    function debounce(fn, delay) {
      let timer;
      return function() {
        clearTimeout(timer);
        timer = setTimeout(fn, delay);
      };
    }

    const map = L.map("uvMap", {
      minZoom: 2,
      maxBounds: [[-85, -100000], [85, 100000]],
      maxBoundsViscosity: 1,
      worldCopyJump: true,
      zoomControl: true,
    }).setView([39.8283, -98.5795], 5);

    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
      noWrap: true,
      minZoom: 2,
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    }).addTo(map);
    function dayNightSymbol(isDay) {
      const shape = isDay
        ? '<g stroke="#f5a623" stroke-width="2.5" stroke-linecap="round"><path d="M16 2v4m0 20v4M2 16h4m20 0h4M6 6l3 3m14 14 3 3M6 26l3-3M23 9l3-3"/></g><circle cx="16" cy="16" r="7" fill="#ffd34d" stroke="#f5a623" stroke-width="1.5"/>'
        : '<path d="M22 3a13 13 0 1 0 7 21A12 12 0 0 1 22 3Z" fill="#e4eaff" stroke="#879ac9" stroke-width="1.5"/>';
      return '<svg role="img" aria-label="' + (isDay ? 'Daytime' : 'Nighttime') + '" width="32" height="32" viewBox="0 0 32 32" style="display:block;filter:drop-shadow(0 1px 2px rgba(0,0,0,0.3))">' + shape + '</svg>';
    }

    function locationPinIcon(isDay) {
      return L.divIcon({
        className: "location-pin",
        iconSize: [32, 73],
        iconAnchor: [16, 73],
        popupAnchor: [0, -73],
        html: '<div style="width:32px;height:32px">' + (typeof isDay === 'boolean' ? dayNightSymbol(isDay) : '') + '</div>' +
          '<svg aria-hidden="true" width="32" height="41" viewBox="0 0 32 41" style="display:block;filter:drop-shadow(0 2px 2px rgba(0,0,0,0.3))"><path d="M16 40C13 34 3 24 3 14a13 13 0 0 1 26 0c0 10-10 20-13 26Z" fill="#2c83c5" stroke="#176399" stroke-width="1.5"/><circle cx="16" cy="14" r="5" fill="white"/></svg>'
      });
    }

    marker = L.marker(map.getCenter(), {
      title: "You are here",
      icon: locationPinIcon()
    }).addTo(map);

    map.on("click", function(event) {
      map.panTo(event.latlng);
      updateLocation(event.latlng.lat, event.latlng.lng);
    });

    map.on("moveend zoomend", debounce(updateFromCenter, 450));

    searchForm.addEventListener("submit", async function(event) {
      event.preventDefault();

      const query = placeSearch.value.trim();

      if (!query) {
        guidance.textContent = "Type a city, park, beach, or address to search the map.";
        return;
      }

      placeName.textContent = "Searching...";
      uvValue.textContent = "--";
      riskLevel.className = "risk-pill";
      riskLevel.textContent = "Search";
      guidance.textContent = "Looking for " + query + ".";

      try {
        searchCandidates = await searchPlaces(query);
        buildSearchSelect();
        searchPicker.style.display = searchCandidates.length > 1 ? "block" : "none";
        searchSelect.value = "0";
        selectSearchCandidate(0);
      } catch (error) {
        searchCandidates = [];
        searchPicker.style.display = "none";
        placeName.textContent = "Place not found";
        riskLevel.className = "risk-pill";
        riskLevel.textContent = "Try again";
        guidance.textContent = "Search for a more specific place, like Carson City or Lake Mead.";
      }
    });

    searchSelect.addEventListener("change", function() {
      selectSearchCandidate(Number(searchSelect.value));
    });

    centerButton.addEventListener("click", function() {
      if (!navigator.geolocation) {
        guidance.textContent = "Your browser does not have location access available.";
        return;
      }

      guidance.textContent = "Finding your location...";
      navigator.geolocation.getCurrentPosition(function(position) {
        const lat = position.coords.latitude;
        const lon = position.coords.longitude;
        map.setView([lat, lon], 12);
        updateLocation(lat, lon);
      }, function() {
        guidance.textContent = "Location permission was not allowed, so the map center is still being used.";
      });
    });

    refreshButton.addEventListener("click", updateFromCenter);

    window.addEventListener("load", function() {
      setTimeout(hideLoadingScreen, 180);
      setTimeout(function() {
        map.invalidateSize();
        updateFromCenter();
      }, 220);
    });
  </script>
  <script src="navigation.js"></script>
</body>
</html>
